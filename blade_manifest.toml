# Display > Screen Resolution (sub_9211BC40): after saving the new size
# (0x9211BCF0) the dashboard shows "Your display settings have changed. Do you
# want to keep the new settings?" and reverts unless answered Yes. That guards
# a TV against a mode it can't show; Blade's window just resizes, so skip it:
# jump to the path taken when the current size is picked again (0x9211BC74,
# message 253, leave the screen). With a VGA AV pack the "Yes" branch of the
# result handler (sub_9211BDF8) does nothing more than that. Conditional, so
# the stock build (BLADE_LAUNCHER=OFF) keeps the prompt with the same codegen.
# Implemented in src/blade_hooks.cpp.
[[entrypoint.midasm_hook]]
name = "BladeSkipDisplayConfirm"
address = 0x9211BD04
jump_address_on_true = 0x9211BC74

